function renderRoute(){return `<div class="sectionhead"><div><div class="eyebrow">12 МЕСЯЦЕВ · 96 МИССИЙ</div><h1>Карта большого заплыва</h1></div><p>2 новых урока в неделю</p></div><div class="notice"><b>Темп без героизма.</b><p>Каждый блок — 8 коротких уроков на месяц: две новые сессии в неделю плюс необязательные повторы. Месяцы 1–4 готовят к актуальному Python+AI-отбору, месяцы 5–12 дают фундамент C, алгоритмов и Unix.</p></div>${ROADMAP.map((b,bi)=>`<details class="routeblock" ${bi===0?'open':''}><summary><span class="routenum">${String(bi+1).padStart(2,'0')}</span><span class="routetitle"><b>${b.title}</b><small>${b.focus}</small></span><span class="routecount">8 УРОКОВ · МЕСЯЦ ${bi+1}</span></summary><div class="routeitems">${b.lessons.map((l,li)=>{const x=ALL[bi*8+li];return `<article class="routeitem"><span class="n">${done(x.index)?'✓':String(x.index+1).padStart(2,'0')}</span><div><b>${l.title}</b><p>${l.goal}</p><code>ИГРА: ${l.game}</code></div></article>`}).join('')}</div></details>`).join('')}${backup()}`}
function renderFacts(){return `<div class="sectionhead"><div><div class="eyebrow">ФАКТЧЕК · 07.11.2026</div><h1>Сначала факты. Потом тренировка.</h1></div></div><div class="notice"><b>Твоя исходная фактура устарела.</b><p>Официальный сайт сейчас описывает не 26-дневный C Piscine, а <b>14 дней офлайн: Python + ИИ, Shell/Bash, Git/GitLab</b>. Старые репозитории полезны как история, но не как расписание будущего казанского потока.</p></div><section class="factgrid"><article class="fact"><span class="fnum">01 / ОНЛАЙН · ≈60 МИН</span><h3>Игра</h3><p>Алгоритмическое мышление, логика и память. Точный проходной балл и формула отбора не опубликованы.</p><span class="unverified">[НЕ ПРОВЕРЕНО] Точные правила подсчёта</span><p>Проверка: инструкция в личном кабинете твоего набора.</p></article><article class="fact"><span class="fnum">02 / ОНЛАЙН · ≈15 + 10 МИН</span><h3>Видео и документы</h3><p>Сейчас на официальной странице указаны видео о школе и загрузка документов, а не видеоинтервью. Интервью встречается в старых отзывах.</p></article><article class="fact"><span class="fnum">03 / ОФФЛАЙН · 14 ДНЕЙ</span><h3>Отборочный «бассейн»</h3><p>Python и осознанная работа с ИИ, Shell/Bash, Git/GitLab. Индивидуальные и командные проекты, экзамены и взаимные проверки. Школа предупреждает о нагрузке до 10 часов в день.</p></article><article class="fact wide"><span class="fnum">ПРАКТИЧЕСКИЕ 20/80</span><h3>Что качаем в первую очередь</h3><ul><li>Самостоятельно писать и отлаживать маленькие Python-программы, не прячась за ИИ.</li><li>Уверенный цикл: терминал → изменил → проверил → git commit/push.</li><li>Читать условие и ошибку, разбивать задачу, тестировать краевые случаи.</li><li>Объяснять своё решение, проверять чужое и договариваться в команде.</li><li>Держать ежедневный режим и не исчезать после первой неудачи.</li></ul><p>Это методический приоритет, <b>не статистика и не гарантия поступления</b>: секретную формулу отбора подтвердить нельзя. C остаётся в курсе ради твоей цели — фундаментальной базы программиста.</p></article><article class="fact wide"><span class="fnum">ОСНОВНОЕ ОБУЧЕНИЕ</span><h3>Что подтверждено — и что нет</h3><p>Для Казани подтверждены метод «равный равному», выбор направления и обязательная стажировка на 3 месяца. <span class="unverified">[НЕ ПРОВЕРЕНО]</span> Обязательное C-ядро, конкретные Shell 00/01, C00…, Rush, malloc, Makefile и Norm в твоём будущем потоке: сейчас официальная страница этого списка не даёт.</p><p>Как проверить: попросить у казанского кампуса актуальный учебный план и сверить задания в личном кабинете за 2–3 месяца до старта.</p></article></section><div class="sectionhead"><div><div class="eyebrow">ИСТОЧНИКИ</div><h2>Можно проверить самому</h2></div></div><section class="pathbox sources"><a href="https://21-school.ru/admission" target="_blank" rel="noopener">Официально: этапы поступления</a><br><a href="https://21-school.ru/training-and-platform" target="_blank" rel="noopener">Официально: актуальная программа интенсива</a><br><a href="https://21-school.ru/campuses/kampus-skoly-21-v-kazani" target="_blank" rel="noopener">Официально: казанский кампус</a><br><a href="https://21-school.ru/employment" target="_blank" rel="noopener">Официально: стажировка и нагрузка</a><br><a href="https://www.novsu.ru/university/press/news/282697/" target="_blank" rel="noopener">18.08.2026: объяснение перехода C → Python + ИИ</a><br><a href="https://github.com/Mechnuna/School-21-Ecole-42---Piscine" target="_blank" rel="noopener">Исторический пример старого Piscine на GitHub</a> · <a href="https://habr.com/ru/articles/1059154/" target="_blank" rel="noopener">Личный опыт 2026: критерии не раскрыты</a></section>`}
function renderTheory(l,p){const t=l.theory[p.theory],last=p.theory===l.theory.length-1;return `<section class="lessonpanel"><div class="theorycard"><div class="theoryicon">${t.icon}</div><div class="eyebrow">КАРТОЧКА ${p.theory+1} / ${l.theory.length}</div><h2>${t.title}</h2><p>${t.text}</p><div class="cardbottom"><div class="dots">${l.theory.map((_,i)=>`<i class="${i<=p.theory?'on':''}"></i>`).join('')}</div><div><button class="secondary small" data-action="theory-prev" ${p.theory===0?'disabled':''}>←</button> <button class="primary" data-action="theory-next">${last?'К мини-игре →':'Дальше →'}</button></div></div></div></section>`}
function renderGame(l,p){const g=p.game,doneGame=g.done,prompt=g.cwd==='/home/guest'?'~':g.cwd.replace('/home/guest','~');return `<section class="lessonpanel"><div class="mission"><small>МИНИ-ИГРА / ЖИВОЙ ТЕРМИНАЛ</small><div class="objectives">${l.game.objectives.map(([id,text])=>`<span class="obj ${g.objectives[id]?'done':''}">${g.objectives[id]?'✓':'○'} ${text}</span>`).join('')}</div></div><div class="terminal"><div class="termbar"><i></i><i></i><i></i><span>guest@21 — training shell</span></div><div class="termlog" id="termLog">${g.logs.map(x=>`<div class="log-${esc(x.kind)}">${esc(x.text)}</div>`).join('')}</div><div class="commandline"><span class="prompt">guest@21:${prompt}$</span><input id="commandInput" aria-label="Команда терминала" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(g.draft)}" placeholder="собери или введи команду"><button class="run" data-action="run" aria-label="Выполнить">↵</button></div></div><div class="tokens">${l.game.tokens.map(t=>`<button class="token" data-action="token" data-token="${t}">${t}</button>`).join('')}<button class="token" data-action="erase">⌫</button></div><div class="hintbox">Нажимай на жетоны, затем <b>↵</b>. На ноутбуке можно печатать и нажимать Enter. Ошибка — это подсказка, XP за неё не снимают.</div>${doneGame?`<div class="successbox"><span>✓ Терминал пройден. +30 XP уже сохранены.</span><button class="primary small" data-action="to-challenge">К челленджу →</button></div>`:''}</section>`}
function renderChallenge(l,p){const c=p.challenge;return `<section class="lessonpanel"><div class="challenge"><div class="eyebrow">ФИНАЛЬНЫЙ ЧЕЛЛЕНДЖ · +70 XP</div><h2>${l.challenge.title}</h2><p>${l.challenge.text}</p><input id="challengeInput" class="codeinput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${l.challenge.placeholder}" value="${esc(c.draft)}" ${c.done?'disabled':''} aria-label="Ответ на челлендж"><button class="primary" data-action="check" ${c.done?'disabled':''}>Проверить ответ</button>${c.feedback?`<div class="${c.done?'successbox':'errorbox'}">${c.feedback}</div>`:''}<div class="lessonfooter"><small>${c.done?'Бейдж получен. Можно двигаться дальше.':'Не бойся пробовать: у каждой ошибки есть разбор.'}</small><button class="primary" data-action="next" ${c.done?'':'disabled'}>Дальше →</button></div></div></section>`}
function renderLesson(){const x=ALL[activeIndex],l=LESSONS.find(q=>q.id===x.id),p=progress(l.id);return `<div class="lessonhead"><button class="iconbtn" data-action="map">← Карта</button><div><div class="eyebrow">УРОК ${String(activeIndex+1).padStart(2,'0')} · ${ROADMAP[x.block].title}</div><h1>${l.title}</h1></div><span class="xppill">${p.completed?'✓ 100 XP':'ДО 100 XP'}</span></div><div class="steps"><button class="step ${p.phase===0?'active':p.theoryDone?'done':''}" data-action="phase" data-phase="0"><span>01 / ТЕОРИЯ</span>${p.theoryDone?'✓ ':''}4 карточки</button><button class="step ${p.phase===1?'active':p.game.done?'done':''}" data-action="phase" data-phase="1" ${!p.theoryDone?'disabled':''}><span>02 / МИНИ-ИГРА</span>${p.game.done?'✓ ':''}Терминал</button><button class="step ${p.phase===2?'active':p.completed?'done':''}" data-action="phase" data-phase="2" ${!p.game.done?'disabled':''}><span>03 / ЧЕЛЛЕНДЖ</span>${p.completed?'✓ ':''}Автопроверка</button></div>${p.phase===0?renderTheory(l,p):p.phase===1?renderGame(l,p):renderChallenge(l,p)}`}
function render(){updateTop();$('#app').innerHTML=view==='map'?renderMap():view==='route'?renderRoute():view==='facts'?renderFacts():renderLesson();window.scrollTo({top:0,behavior:'smooth'});const log=$('#termLog');if(log)log.scrollTop=log.scrollHeight}
function setView(v){view=v;render()}
function openLesson(i){if(!hasLesson(i)){toast(done(i-1)?'Этот урок появится в следующем обновлении':'Сначала закрой предыдущую миссию');return}if(!unlocked(i)){toast('Сначала закрой предыдущую миссию');return}activeIndex=i;view='lesson';render()}
function awardGame(p){if(p.game.xpAwarded)return;p.game.xpAwarded=true;state.xp+=30;toast('+30 XP · мини-игра пройдена')}
function runCommand(l,p){const g=p.game,raw=g.draft.trim();if(!raw){toast('Сначала введи команду или нажми на жетоны');return}g.logs.push({kind:'in',text:raw});const parts=raw.split(/\s+/),cmd=parts[0],arg=parts[1],add=(kind,text)=>g.logs.push({kind,text});if(parts.length>2)add('err','Слишком много слов. Здесь нужна одна команда и максимум один аргумент.');else if(cmd==='ls'&&!arg){g.objectives.ls=true;add('out',g.cwd==='/home/guest'?'piscine/   notes.txt   readme.md':'day01/   plan.txt');add('ok','Есть контакт: ls показывает, что находится в текущей папке.')}else if(cmd==='pwd'&&!arg){add('out',g.cwd);if(g.cwd==='/home/guest/piscine'){g.objectives.pwd=true;add('ok','Полный путь получен. Ты точно знаешь, где находишься.')}else add('out','Подсказка: сначала войди в piscine, затем снова вызови pwd.')}else if(cmd==='cd'){if(!arg)add('err','cd спрашивает: «Куда идти?» Добавь аргумент: cd piscine');else if(arg==='piscine'){if(g.cwd!=='/home/guest')add('err','В этой папке нет piscine. Вернись выше командой cd ..');else{g.cwd='/home/guest/piscine';g.objectives.cd=true;add('ok','Переход выполнен. Проверь новый адрес командой pwd.')}}else if(arg==='..'){g.cwd='/home/guest';add('out','Ты поднялся на один уровень: /home/guest')}else add('err',`cd: ${arg}: папки нет. Названия важны: попробуй piscine.`)}else if(cmd==='rm')add('err','rm удаляет данные — в этой миссии разрушать ничего не нужно. Для перехода используй cd piscine.');else add('err',`Неизвестная команда: ${cmd}. В этой миссии пригодятся ls, cd и pwd.`);g.draft='';g.logs=g.logs.slice(-14);if(!g.done&&Object.values(g.objectives).every(Boolean)){g.done=true;awardGame(p)}save(true);render()}
function checkChallenge(l,p){const c=p.challenge,raw=c.draft.trim(),norm=raw.toLowerCase().replace(/\s+/g,' ');c.attempts.push(raw);if(l.challenge.answers.includes(norm)){c.done=true;c.feedback='✓ Верно: <b>pwd</b> = Print Working Directory. Команда печатает полный путь к текущей папке.';if(!c.xpAwarded){c.xpAwarded=true;state.xp+=70}p.completed=true;save(true);render();showReward()}else{c.feedback=l.challenge.hints[norm]||l.challenge.default;save(true);render();setTimeout(()=>$('#challengeInput')?.focus(),50)}}
function showReward(){const box=$('#confetti');box.innerHTML=Array.from({length:14},(_,i)=>`<i class="confetti" style="left:${5+i*7}%;animation-delay:${(i%5)*.18}s"></i>`).join('');$('#rewardModal').classList.remove('hidden');setTimeout(()=>$('#rewardModal button').focus(),50)}
function exportJSON(){const payload={app:'PISCINE//RUN',version:1,exportedAt:new Date().toISOString(),data:state},blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`piscine-run-${day()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия JSON готова')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(['map','route','facts'].includes(a))setView(a);else if(a==='open')openLesson(+b.dataset.index);else if(a==='export')exportJSON();else if(a==='import')$('#importFile').click();else if(a==='reset'){if(confirm('Удалить весь прогресс на этом устройстве? Экспортируй JSON, если хочешь сохранить копию.')){state=freshState();save();setView('map');toast('Прогресс сброшен')}}else if(a==='close-reward'){$('#rewardModal').classList.add('hidden');$('#app [data-action="next"]')?.focus()}else{const l=LESSONS.find(q=>q.id===ALL[activeIndex].id),p=progress(l.id);if(a==='theory-prev'){p.theory=Math.max(0,p.theory-1);save();render()}else if(a==='theory-next'){if(p.theory<l.theory.length-1)p.theory++;else{p.theoryDone=true;p.phase=1}save(true);render()}else if(a==='phase'){const n=+b.dataset.phase;if(n===1&&!p.theoryDone||n===2&&!p.game.done)return;p.phase=n;save();render()}else if(a==='token'){const t=b.dataset.token,g=p.game;g.draft=(g.draft.trimEnd()+(g.draft.trim()?' ':'')+t);save();render();$('#commandInput')?.focus()}else if(a==='erase'){p.game.draft=p.game.draft.trim().split(/\s+/).slice(0,-1).join(' ');save();render()}else if(a==='run')runCommand(l,p);else if(a==='to-challenge'){p.phase=2;save();render()}else if(a==='check')checkChallenge(l,p);else if(a==='next'){if(!p.completed)return;const next=activeIndex+1;if(hasLesson(next))openLesson(next);else{setView('map');toast('Награда сохранена. Следующий урок — в следующем обновлении!')}}}});
document.addEventListener('input',e=>{if(view!=='lesson')return;const l=LESSONS.find(q=>q.id===ALL[activeIndex].id),p=progress(l.id);if(e.target.id==='commandInput')p.game.draft=e.target.value;else if(e.target.id==='challengeInput')p.challenge.draft=e.target.value;else return;save()});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||view!=='lesson')return;const l=LESSONS.find(q=>q.id===ALL[activeIndex].id),p=progress(l.id);if(e.target.id==='commandInput'){e.preventDefault();runCommand(l,p)}else if(e.target.id==='challengeInput'&&!p.challenge.done){e.preventDefault();checkChallenge(l,p)}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>2e6)throw Error('big');const text=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsText(file)}),parsed=JSON.parse(text);state=validState(parsed.data||parsed);save();setView('map');toast('Прогресс импортирован. Продолжаем с сохранённого места!')}catch(err){toast('Не похоже на резервную копию PISCINE//RUN. Файл не применён.')}});
render();
</script>
